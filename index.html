        // 2. Логика подсчёта профиля, оценок и формирования лога (разделы 5 и 7)
        // =========================================================================

        var CATEGORY_TITLES = {
          dishes: 'Блюда и состав',
          regulation: 'Регламент сервиса',
          guest: 'Работа с гостем',
          sales: 'Продажи и рекомендации',
          confidence: 'Уверенность и логика ответов',
        };

        var CATEGORY_ORDER = [
          'dishes',
          'regulation',
          'guest',
          'sales',
          'confidence',
        ];

        function createInitialProfile() {
          return {
            categories: {
              dishes: {
                key: 'dishes',
                title: CATEGORY_TITLES.dishes,
                questionsCount: 0,
                scoreSum: 0,
                percent: null,
                comment: 'Ещё не проверялось',
              },
              regulation: {
                key: 'regulation',
                title: CATEGORY_TITLES.regulation,
                questionsCount: 0,
                scoreSum: 0,
                percent: null,
                comment: 'Ещё не проверялось',
              },
              guest: {
                key: 'guest',
                title: CATEGORY_TITLES.guest,
                questionsCount: 0,
                scoreSum: 0,
                percent: null,
                comment: 'Ещё не проверялось',
              },
              sales: {
                key: 'sales',
                title: CATEGORY_TITLES.sales,
                questionsCount: 0,
                scoreSum: 0,
                percent: null,
                comment: 'Ещё не проверялось',
              },
              confidence: {
                key: 'confidence',
                title: CATEGORY_TITLES.confidence,
                questionsCount: 0,
                scoreSum: 0,
                percent: null,
                comment: 'Оценивается по ходу диалога',
              },
            },
            evaluatedCount: 0,
            totalScoreSum: 0,
            score: 0,
            status: 'средний',
          };
        }

        function getEvaluationWeight(evaluation) {
          if (evaluation === 'правильно') return 1;
          if (evaluation === 'частично правильно') return 0.5;
          return 0;
        }

        function deriveStatus(score, evaluatedCount) {
          if (evaluatedCount === 0) return 'средний';
          if (score >= 80) return 'сильный';
          if (score >= 50) return 'средний';
          return 'слабый';
        }

        function summarizeCategoryComment(percent, latestComment) {
          if (percent === 100) return 'Уверенное владение темой. ' + latestComment;
          if (percent >= 50) return 'Есть пробелы в деталях. ' + latestComment;
          return 'Требуется проработка. ' + latestComment;
        }

        function updateProfileWithReply(prev, reply, stepCategory) {
          var nextCategories = {
            dishes: Object.assign({}, prev.categories.dishes),
            regulation: Object.assign({}, prev.categories.regulation),
            guest: Object.assign({}, prev.categories.guest),
            sales: Object.assign({}, prev.categories.sales),
            confidence: Object.assign({}, prev.categories.confidence),
          };

          var evaluatedCount = prev.evaluatedCount;
          var totalScoreSum = prev.totalScoreSum;
          var targetCategory = reply.profileCategory || stepCategory;

          if (reply.wasAnswer && targetCategory && targetCategory !== 'confidence') {
            var weight = getEvaluationWeight(reply.evaluation);
            var current = nextCategories[targetCategory];
            var newCount = current.questionsCount + 1;
            var newSum = current.scoreSum + weight;
            var newPercent = Math.round((newSum / newCount) * 100);

            nextCategories[targetCategory] = Object.assign({}, current, {
              questionsCount: newCount,
              scoreSum: newSum,
              percent: newPercent,
              comment: summarizeCategoryComment(newPercent, reply.checkComment),
            });

            evaluatedCount += 1;
            totalScoreSum += weight;
          }

          var score =
            evaluatedCount > 0
              ? Math.round((totalScoreSum / evaluatedCount) * 100)
              : prev.score;
          var status = deriveStatus(score, evaluatedCount);

          if (reply.confidenceNote) {
            var prevComment = nextCategories.confidence.comment;
            var base =
              prevComment === 'Оценивается по ходу диалога' ? '' : prevComment + ' ';
            nextCategories.confidence = Object.assign({}, nextCategories.confidence, {
              comment: (base + reply.confidenceNote + '.').trim(),
            });
          } else if (reply.wasAnswer) {
            var curConf = nextCategories.confidence.comment;
            if (curConf.indexOf('Попытка') === -1) {
              if (score >= 80) {
                nextCategories.confidence.comment =
                  'Ответы чёткие, последовательные, правила экзамена соблюдаются.';
              } else if (score >= 50) {
                nextCategories.confidence.comment =
                  'Отвечает по делу, но местами теряет важные детали под давлением.';
              } else {
                nextCategories.confidence.comment =
                  'Заметна неуверенность, допускает серьёзные пропуски в базе.';
              }
            }
          }

          return {
            categories: nextCategories,
            evaluatedCount: evaluatedCount,
            totalScoreSum: totalScoreSum,
            score: score,
            status: status,
          };
        }

        function extractStrengthsAndWeaknesses(profile) {
          var scoredKeys = ['dishes', 'regulation', 'guest', 'sales'];
          var tested = scoredKeys
            .map(function (k) {
              return profile.categories[k];
            })
            .filter(function (c) {
              return c.questionsCount > 0 && c.percent !== null;
            });

          if (tested.length === 0) {
            return {
              strengths: ['Диалог поддержан до завершения'],
              weaknesses: ['Недостаточно оценённых ответов по меню и регламенту'],
            };
          }

          var percents = tested.map(function (c) {
            return c.percent || 0;
          });
          var maxPercent = Math.max.apply(null, percents);
          var minPercent = Math.min.apply(null, percents);

          var strengths = tested
            .filter(function (c) {
              return (
                (c.percent || 0) >= 75 ||
                (maxPercent >= 50 && c.percent === maxPercent)
              );
            })
            .map(function (c) {
              return c.title + ' — ' + c.percent + '% (' + c.questionsCount + ' вопр.)';
            });

          var weaknesses = tested
            .filter(function (c) {
              return (
                (c.percent || 0) < 75 ||
                (minPercent < 100 && c.percent === minPercent && (c.percent || 0) < 100)
              );
            })
            .map(function (c) {
              return c.title + ' — ' + c.percent + '% (' + c.questionsCount + ' вопр.)';
            });

          if (strengths.length === 0) {
            strengths.push('Готовность отвечать на вопросы экзаменатора до конца');
          }
          if (weaknesses.length === 0) {
            weaknesses.push('Критичных пробелов не выявлено — все проверенные темы на 100%');
          }

          return { strengths: strengths, weaknesses: weaknesses };
        }

        function formatAgentTraceText(trace) {
          var p = trace.profileSnapshot;
          var catLines = CATEGORY_ORDER.map(function (key, idx) {
            var c = p.categories[key];
            if (key === 'confidence') {
              return idx + 1 + ') ' + c.title + ': ' + c.comment;
            }
            var pctStr = c.percent === null ? '—' : c.percent + '%';
            return (
              idx +
              1 +
              ') ' +
              c.title +
              ': Вопросов: ' +
              c.questionsCount +
              ', Правильных: ' +
              pctStr +
              ', ' +
              c.comment
            );
          }).join('\n');

          return [
            'AGENT ANSWER CHECK',
            'Был ли ответ на вопрос: ' + (trace.wasAnswer ? 'да' : 'нет'),
            'Тема прошлого вопроса: ' + trace.pastTopic,
            'Оценка ответа: ' + (trace.evaluation || 'не оценивается (служебный шаг)'),
            'Комментарий: ' + trace.checkComment,
            '',
            'AGENT BRANCH',
            'Текущая ветка: ' + trace.branch,
            '',
            'AGENT PROFILE',
            catLines,
            'Общий статус: ' + p.status + ' кандидат (текущий балл: ' + p.score + '%)',
            '',
            'AGENT TOPIC ANALYZER',
            'Текущая тема: ' + trace.nextTopic,
            'Сложность: ' + (trace.nextDifficulty || '—'),
            'Причина выбора: ' + trace.nextTopicReason,
            '',
            'EXPECTED ANSWER',
            trace.nextExpectedAnswer,
            '',
            'FINAL AGENT RESPONSE',
            trace.finalAgentResponse,
          ].join('\n');
        }

        var HINT_STORAGE_KEY = 'stimit_waiter_exam_hint_seen';

        function readHintState() {
          try {
            return window.localStorage.getItem(HINT_STORAGE_KEY) !== '1';
          } catch (e) {
            return true;
          }
        }

        function persistHintDismissed() {
          try {
            window.localStorage.setItem(HINT_STORAGE_KEY, '1');
          } catch (e) {
            // Игнорируем ограничения хранилища
          }
        }

        // =========================================================================
        // 4. Состояние приложения
        // =========================================================================

        var state = {
          view: 'landing', // 'landing' | 'exam' | 'summary'
          activeScenarioId: 'experienced',
          showFirstVisitHint: readHintState(),
          isKnowledgeBaseOpen: false,
          kbTab: 'menu', // 'menu' | 'regulation'

          // Состояние экрана экзамена
          currentStepIndex: 0,
          profile: createInitialProfile(),
          traces: [],
          selectedTraceStep: null,
          isTraceExpanded: false,
          expandedChatTraceIds: {},
          messages: [],
          isTyping: false,
          cascadeStage: -1,
          activeFinalAgent: 'Экзаменатор',
          highlightTick: 0,
          isFinished: false,
          mobileTab: 'dialog',
          agentsUpdatedBadge: false,
          freeText: '',

          // Итог миссии
          finalResult: null,
          summaryScoreAnimated: 0,
          summaryRevealStep: 0,
        };

        var pendingTimers = [];
        var summaryTimers = [];
        var summaryRafId = 0;

        function clearPendingTimers() {
          pendingTimers.forEach(function (id) {
            window.clearTimeout(id);
          });
          pendingTimers = [];
        }

        function clearSummaryAnimations() {
          summaryTimers.forEach(function (id) {
            window.clearTimeout(id);
          });
          summaryTimers = [];
          if (summaryRafId) {
            window.cancelAnimationFrame(summaryRafId);
            summaryRafId = 0;
          }
        }

        function getActiveScenario() {
          for (var i = 0; i < SCENARIOS.length; i++) {
            if (SCENARIOS[i].id === state.activeScenarioId) return SCENARIOS[i];
          }
          return SCENARIOS[0];
        }

        function dismissHintOnce() {
          if (state.showFirstVisitHint) {
            state.showFirstVisitHint = false;
            persistHintDismissed();
          }
        }

        function resetExamStateForScenario(scenario) {
          clearPendingTimers();
          state.currentStepIndex = 0;
          state.profile = createInitialProfile();
          state.traces = [];
          state.selectedTraceStep = null;
          state.isTraceExpanded = false;
          state.expandedChatTraceIds = {};
          state.messages = [
            {
              id: 'init-' + scenario.id + '-' + Date.now(),
              sender: 'agent',
              agentName: 'Экзаменатор',
              text: scenario.initialQuestion,
            },
          ];
          state.isTyping = false;
          state.cascadeStage = -1;
          state.activeFinalAgent = 'Экзаменатор';
          state.highlightTick = 0;
          state.isFinished = false;
          state.mobileTab = 'dialog';
          state.agentsUpdatedBadge = false;
          state.freeText = '';
        }

        function startScenario(scenarioId) {
          dismissHintOnce();
          state.activeScenarioId = scenarioId;
          state.finalResult = null;
          var scenario = getActiveScenario();
          resetExamStateForScenario(scenario);
          state.view = 'exam';
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openSummaryScreen() {
          clearSummaryAnimations();
          state.finalResult = {
            profile: state.profile,
            traces: state.traces.slice(),
          };
          state.view = 'summary';

          var targetScore = state.profile.score;
          var prefersReduced =
            window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          if (prefersReduced) {
            state.summaryScoreAnimated = targetScore;
            state.summaryRevealStep = 3;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          state.summaryScoreAnimated = 0;
          state.summaryRevealStep = 0;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });

          var duration = 850;
          var start = performance.now();

          function tick(now) {
            var elapsed = now - start;
            var progress = Math.min(elapsed / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 3);
            state.summaryScoreAnimated = Math.round(eased * targetScore);
            var scoreEl = document.getElementById('summary-score-value');
            if (scoreEl) {
              scoreEl.textContent = state.summaryScoreAnimated + '%';
            }
            if (progress < 1 && state.view === 'summary') {
              summaryRafId = window.requestAnimationFrame(tick);
            }
          }

          summaryRafId = window.requestAnimationFrame(tick);

          summaryTimers.push(
            window.setTimeout(function () {
              state.summaryRevealStep = 1;
              updateSummaryRevealClasses();
            }, 450)
          );
          summaryTimers.push(
            window.setTimeout(function () {
              state.summaryRevealStep = 2;
              updateSummaryRevealClasses();
            }, 850)
          );
          summaryTimers.push(
            window.setTimeout(function () {
              state.summaryRevealStep = 3;
              updateSummaryRevealClasses();
            }, 1250)
          );
        }

        function updateSummaryRevealClasses() {
          for (var s = 1; s <= 3; s++) {
            var el = document.getElementById('summary-reveal-' + s);
            if (!el) continue;
            if (state.summaryRevealStep >= s) {
              el.classList.remove('opacity-0', 'translate-y-2');
              el.classList.add('opacity-100', 'translate-y-0');
            }
          }
        }

        function handleSelectReply(replyId) {
          var scenario = getActiveScenario();
          var currentStep = scenario.steps[state.currentStepIndex];
          if (state.isTyping || state.isFinished || !currentStep) return;

          var reply = null;
          for (var i = 0; i < currentStep.replies.length; i++) {
            if (currentStep.replies[i].id === replyId) {
              reply = currentStep.replies[i];
              break;
            }
          }
          if (!reply) return;

          var candidateMsg = {
            id: 'cand-' + currentStep.stepNumber + '-' + reply.id + '-' + Date.now(),
            sender: 'candidate',
            text: reply.label,
            stepNumber: currentStep.stepNumber,
          };

          state.messages.push(candidateMsg);
          state.isTyping = true;
          state.activeFinalAgent = reply.finalAgent;

          var updatedProfile = updateProfileWithReply(
            state.profile,
            reply,
            currentStep.profileCategory
          );

          var isLastStep = state.currentStepIndex === scenario.steps.length - 1;
          var isPassing = updatedProfile.score >= 70;

          var finalTextParts = [];
          if (isLastStep) {
            finalTextParts.push(
              isPassing
                ? reply.agentReplyText +
                    '\n\nВердикт: СДАЛ (' +
                    updatedProfile.score +
                    '%). ' +
                    scenario.passSummaryText
                : reply.agentReplyText +
                    '\n\nВердикт: НЕ СДАЛ (' +
                    updatedProfile.score +
                    '%). ' +
                    scenario.failSummaryText
            );
          } else {
            finalTextParts.push(reply.agentReplyText);
            if (reply.nextQuestionText) {
              finalTextParts.push(reply.nextQuestionText);
            }
          }

          var fullFinalAgentResponse = finalTextParts.join('\n\n');

          var trace = {
            stepNumber: currentStep.stepNumber,
            candidateText: reply.label,
            wasAnswer: reply.wasAnswer,
            pastTopic: currentStep.topicLabel,
            evaluation: reply.evaluation,
            checkComment: reply.checkComment,
            branch: reply.branch,
            finalAgent: reply.finalAgent,
            profileSnapshot: updatedProfile,
            nextTopic: reply.nextTopicLabel,
            nextDifficulty: reply.nextDifficulty,
            nextTopicReason: reply.nextTopicReason,
            nextExpectedAnswer: reply.nextExpectedAnswer || currentStep.expectedAnswer,
            finalAgentResponse: fullFinalAgentResponse,
          };

          state.cascadeStage = 0;
          render();
          scrollChatToBottom();

          var t1 = window.setTimeout(function () {
            state.cascadeStage = 1;
            render();
          }, 130);

          var t2 = window.setTimeout(function () {
            state.cascadeStage = 2;
            render();
          }, 260);

          var t3 = window.setTimeout(function () {
            state.cascadeStage = 3;
            state.profile = updatedProfile;
            state.traces.push(trace);
            state.selectedTraceStep = trace.stepNumber;
            state.highlightTick += 1;
            if (state.mobileTab === 'dialog') {
              state.agentsUpdatedBadge = true;
            }
            render();
          }, 390);

          var t4 = window.setTimeout(function () {
            state.cascadeStage = 4;
            render();
          }, 520);

          var t5 = window.setTimeout(function () {
            var agentMsg = {
              id: 'agent-' + currentStep.stepNumber + '-' + Date.now(),
              sender: 'agent',
              agentName: reply.finalAgent,
              text: fullFinalAgentResponse,
              stepNumber: currentStep.stepNumber,
              trace: trace,
            };
            state.messages.push(agentMsg);
            state.isTyping = false;
            state.cascadeStage = -1;
            if (isLastStep) {
              state.isFinished = true;
            } else {
              state.currentStepIndex += 1;
            }
            render();
            scrollChatToBottom();
          }, 760);

          pendingTimers.push(t1, t2, t3, t4, t5);
        }

        function handleFreeTextSubmit() {
          var trimmed = state.freeText.trim();
          if (!trimmed || state.isTyping) return;

          state.messages.push({
            id: 'free-' + Date.now(),
            sender: 'candidate',
            text: trimmed,
          });
          state.messages.push({
            id: 'notice-' + (Date.now() + 1),
            sender: 'system',

        function renderCompactPipeline(
          activeStageIndex,
          activeFinalAgent,
          completedStepsCount,
          totalSteps,
          currentStepNumber
        ) {
          var stages = [
            { id: 'answer_check', label: 'Сравнение ответа' },
            { id: 'branch', label: 'Ветка' },
            { id: 'profiler', label: 'Профайлер' },
            { id: 'topic_analyzer', label: 'Выбор темы' },
            { id: 'final', label: activeFinalAgent },
          ];

          var stagesHtml = stages
            .map(function (stage, idx) {
              var isCompleted =
                activeStageIndex > idx ||
                (activeStageIndex === -1 && completedStepsCount > 0 && idx < 4);
              var isActive = activeStageIndex === idx;
              var isFinalIdleHighlight = activeStageIndex === -1 && idx === 4;

              var boxCls = isActive
                ? 'border-blue-600 bg-blue-600 text-white shadow-sm animate-node-pulse'
                : isFinalIdleHighlight
                  ? 'border-blue-300 bg-blue-50 text-blue-800'
                  : isCompleted
                    ? 'border-emerald-200 bg-emerald-50 text-emerald-800'
                    : 'border-slate-200 bg-white text-slate-500';

              var indicator =
                isCompleted && !isActive
                  ? icon('check', 'h-3.5 w-3.5 text-emerald-600 shrink-0')
                  : '<span class="font-mono text-[10px] tabular-nums ' +
                    (isActive
                      ? 'text-blue-100'
                      : isFinalIdleHighlight
                        ? 'text-blue-600'
                        : 'text-slate-400') +
                    '">0' +
                    (idx + 1) +
                    '</span>';

              var arrow =
                idx < stages.length - 1
                  ? icon(
                      'arrowRight',
                      'h-3.5 w-3.5 shrink-0 transition-colors ' +
                        (isCompleted || isActive ? 'text-blue-500' : 'text-slate-300')
                    )
                  : '';

              return (
                '<div class="flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-xs font-medium whitespace-nowrap shrink-0 transition-all duration-200 ' +
                boxCls +
                '">' +
                indicator +
                '<span>' +
                escapeHtml(stage.label) +
                '</span>' +
                '</div>' +
                arrow
              );
            })
            .join('');

          var stepChips = '';
          for (var i = 1; i <= totalSteps; i++) {
            var done = i <= completedStepsCount;
            var current = i === currentStepNumber && completedStepsCount < totalSteps;
            var chipCls = done
              ? 'bg-emerald-600 text-white'
              : current
                ? 'border border-blue-600 bg-blue-50 text-blue-700'
                : 'border border-slate-200 bg-white text-slate-400';

            stepChips +=
              '<span class="flex h-6 w-6 items-center justify-center rounded-md text-[11px] font-mono font-medium tabular-nums transition-colors ' +
              chipCls +
              '">' +
              (done ? icon('check', 'h-3.5 w-3.5') : i) +
              '</span>';
          }

          return (
            '<div class="flex flex-col gap-2.5 lg:flex-row lg:items-center lg:justify-between">' +
            '<div class="flex items-center gap-1.5 overflow-x-auto pb-1 lg:pb-0" aria-label="Конвейер агентов текущего шага">' +
            stagesHtml +
            '</div>' +
            '<div class="flex items-center gap-3 shrink-0">' +
            '<div class="flex items-center gap-1" aria-hidden="true">' +
            stepChips +
            '</div>' +
            '<span class="text-xs font-semibold text-slate-700 tabular-nums whitespace-nowrap">Шаг ' +
            Math.min(currentStepNumber, totalSteps) +
            ' из ' +
            totalSteps +
            '</span>' +
            '</div>' +
            '</div>'
          );
        }

        function renderExamView() {
          var scenario = getActiveScenario();
          var currentStep = scenario.steps[state.currentStepIndex];
          var completedStepsCount = state.traces.length;
          var currentDisplayStep = state.isFinished
            ? scenario.steps.length
            : state.currentStepIndex + 1;

          // Выбранный trace для инспектора
          var activeTrace = null;
          if (state.traces.length > 0) {
            if (state.selectedTraceStep !== null) {
              for (var i = 0; i < state.traces.length; i++) {
                if (state.traces[i].stepNumber === state.selectedTraceStep) {
                  activeTrace = state.traces[i];
                  break;
                }
              }
            }
            if (!activeTrace) {
              activeTrace = state.traces[state.traces.length - 1];
            }
          }

          var currentTopicDisplay = activeTrace
            ? activeTrace.nextTopic
            : scenario.initialTopic;
          var currentDifficultyDisplay = activeTrace
            ? activeTrace.nextDifficulty || '—'
            : scenario.initialDifficulty;
          var currentExpectedDisplay = activeTrace
            ? activeTrace.nextExpectedAnswer
            : scenario.initialExpectedAnswer;

          var statusColorClass =
            state.profile.status === 'сильный'
              ? 'text-emerald-700'
              : state.profile.status === 'средний'
                ? 'text-blue-700'
                : 'text-red-700';

          // Сообщения чата
          var messagesHtml = state.messages
            .map(function (msg) {
              if (msg.sender === 'system') {
                var shortcuts = msg.showScenarioShortcuts
                  ? '<div class="mt-3 flex flex-wrap gap-2">' +
                    SCENARIOS.map(function (sc) {
                      var activeCls =
                        sc.id === scenario.id
                          ? 'border-blue-600 bg-blue-700 text-white'
                          : 'border-slate-300 bg-white text-slate-700 hover:border-blue-400 hover:text-blue-700';
                      return (
                        '<button type="button" data-action="start-scenario" data-scenario-id="' +
                        escapeHtml(sc.id) +
                        '" class="rounded-lg border px-3 py-1.5 text-xs font-semibold transition-colors whitespace-nowrap ' +
                        activeCls +

                        escapeHtml(sc.title) +
                        '</button>'

                    '</div>'
                  : '';

                return (
                  '<div class="rounded-xl border border-amber-200 bg-amber-50/70 p-4 text-sm text-slate-800">' +
                  '<p class="font-medium leading-relaxed">' +
                  escapeHtml(msg.text) +
                  '</p>' +
                  shortcuts +
                  '</div>'
                );
              }

              var isCandidate = msg.sender === 'candidate';
              var isTraceOpen = !!state.expandedChatTraceIds[msg.id];
              var bubbleCls = isCandidate
                ? 'bg-blue-700 text-white shadow-sm'
                : msg.agentName === 'Защита'
                  ? 'border border-indigo-200 bg-indigo-50/70 text-slate-900'
                  : msg.agentName === 'Консультант'
                    ? 'border border-sky-200 bg-sky-50/70 text-slate-900'
                    : msg.agentName === 'Завершение'
                      ? 'border border-emerald-200 bg-emerald-50/60 text-slate-900'
                      : 'border border-slate-200 bg-slate-50 text-slate-900';

              var stepMeta = msg.stepNumber
                ? '<span aria-hidden="true">·</span><span class="font-mono tabular-nums">Шаг ' +
                  msg.stepNumber +
                  '</span>'
                : '';

              var traceBlock = '';

                  '<span>' +

                      escapeHtml(formatAgentTraceText(msg.trace)) +

                '<div class="mb-1 flex items-center gap-2 text-[11px] font-semibold text-slate-500">' +

              '</div>'
            : '';

          // Блок кнопок выбора реплики ИЛИ финальная кнопка итога

            '</section>' +
            '<section class="grid grid-cols-1 gap-5 md:grid-cols-3">' +
            '<div id="summary-reveal-1" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition-all duration-300 ' +
            rev1Cls +
            '">' +
            '<div class="flex items-center gap-2 text-sm font-bold text-emerald-800">' +
            icon('checkCircle2', 'h-4 w-4 text-emerald-600 shrink-0') +
            '<h2>Сильные стороны</h2>' +
            '</div>' +
            '<ul class="mt-3 space-y-2 text-sm text-slate-700">' +
            sw.strengths
              .map(function (item) {
                return '<li class="leading-snug">• ' + escapeHtml(item) + '</li>';
              })
              .join('') +
            '</ul>' +
            '</div>' +
            '<div id="summary-reveal-2" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition-all duration-300 ' +
            rev2Cls +
            '">' +
            '<div class="flex items-center gap-2 text-sm font-bold text-amber-800">' +
            icon('alertCircle', 'h-4 w-4 text-amber-600 shrink-0') +
            '<h2>Слабые стороны</h2>' +
            '</div>' +
            '<ul class="mt-3 space-y-2 text-sm text-slate-700">' +
            sw.weaknesses
              .map(function (item) {
                return '<li class="leading-snug">• ' + escapeHtml(item) + '</li>';
              })
              .join('') +
            '</ul>' +
            '</div>' +
            '<div id="summary-reveal-3" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition-all duration-300 ' +
            rev3Cls +
            '">' +
            '<div class="flex items-center gap-2 text-sm font-bold text-blue-800">' +
            icon('clipboardCheck', 'h-4 w-4 text-blue-700 shrink-0') +
            '<h2>Рекомендация</h2>' +
            '</div>' +
            '<p class="mt-3 text-sm leading-relaxed text-slate-700">' +
            escapeHtml(recommendationText) +
            '</p>' +
            '</div>' +
            '</section>' +
            '<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">' +
            '<h2 class="text-base font-bold text-slate-900">Итоговый профиль кандидата по 5 категориям</h2>' +
            '<div class="mt-4 divide-y divide-slate-100">' +
            profileRows +
            '</div>' +
            '</section>' +
            '<section class="flex flex-col items-stretch justify-between gap-3 pt-2 sm:flex-row sm:items-center">' +
            '<div class="flex flex-wrap items-center gap-3">' +
            '<button type="button" data-action="start-scenario" data-scenario-id="' +
            escapeHtml(scenario.id) +
            '" class="inline-flex min-h-[48px] items-center justify-center gap-2 rounded-xl bg-blue-700 px-6 py-3 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-800 whitespace-nowrap">' +
            icon('rotateCcw', 'h-4 w-4') +
            '<span>Пройти ещё раз</span>' +
            '</button>' +
            '<button type="button" data-action="go-landing" class="inline-flex min-h-[48px] items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-6 py-3 text-sm font-semibold text-slate-800 transition-colors hover:border-blue-400 hover:bg-blue-50/40 whitespace-nowrap">' +
            icon('layoutGrid', 'h-4 w-4 text-blue-700') +
            '<span>Другие сценарии</span>' +
            '</button>' +
            '</div>' +
            '<span class="text-xs text-slate-500">Демо-стенд STIMIT · Все вычисления выполнены локально</span>' +
            '</section>' +
            '</main>' +
            '</div>'
          );
        }

        function renderKnowledgeBaseModal() {
          if (!state.isKnowledgeBaseOpen) return '';

          var contentHtml = '';
          if (state.kbTab === 'menu') {
            contentHtml =
              '<div class="grid grid-cols-1 gap-4 md:grid-cols-2">' +
              MENU_ITEMS.map(function (item) {
                var allergensText =
                  item.allergens.length > 0
                    ? item.allergens.join(' · ')
                    : 'не указаны';
                var noteHtml = item.note
                  ? '<div class="flex items-start gap-1.5 text-xs text-amber-800">' +
                    icon('alertTriangle', 'mt-0.5 h-3.5 w-3.5 shrink-0 text-amber-600') +
                    '<span>' +
                    escapeHtml(item.note) +
                    '</span>' +
                    '</div>'
                  : '';

                return (
                  '<article class="flex flex-col justify-between rounded-xl border border-slate-200 bg-white p-4 transition-shadow hover:shadow-sm">' +
                  '<div>' +
                  '<div class="flex items-baseline justify-between gap-3">' +
                  '<h3 class="text-sm font-bold text-slate-900">' +
                  String(item.id).padStart(2, '0') +
                  '. ' +
                  escapeHtml(item.name) +
                  '</h3>' +
                  '<span class="font-mono text-sm font-semibold text-blue-700 tabular-nums whitespace-nowrap shrink-0">' +
                  escapeHtml(item.price) +
                  '</span>' +
                  '</div>' +
                  '<p class="mt-2 text-xs leading-relaxed text-slate-600">' +
                  escapeHtml(item.ingredients) +
                  '</p>' +
                  '</div>' +
                  '<div class="mt-3 pt-3 border-t border-slate-100 space-y-1.5">' +
                  '<div class="text-xs text-slate-500"><span class="font-semibold text-slate-700">Аллергены: </span>' +
                  escapeHtml(allergensText) +
                  '</div>' +
                  noteHtml +
                  '</div>' +
                  '</article>'
                );
              }).join('') +
              '</div>';
          } else {
            contentHtml =
              '<div class="divide-y divide-slate-200 rounded-xl border border-slate-200 bg-white">' +
              REGULATION_RULES.map(function (rule) {
                return (
                  '<div class="p-4 sm:px-5">' +
                  '<div class="flex items-baseline gap-3">' +
                  '<span class="font-mono text-xs font-semibold text-blue-700 tabular-nums">' +
                  String(rule.id).padStart(2, '0') +
                  '</span>' +
                  '<h3 class="text-sm font-bold text-slate-900">' +
                  escapeHtml(rule.title) +
                  '</h3>' +
                  '</div>' +
                  '<p class="mt-1.5 pl-7 text-sm leading-relaxed text-slate-600">' +
                  escapeHtml(rule.description) +
                  '</p>' +
                  '</div>'
                );
              }).join('') +
              '</div>';
          }

          return (
            '<div data-action="close-kb-backdrop" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="kb-modal-title">' +
            '<div data-modal-dialog="true" class="flex max-h-[88vh] w-full max-w-4xl flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl">' +
            '<div class="flex items-center justify-between gap-4 border-b border-slate-200 px-6 py-4">' +
            '<div>' +
            '<h2 id="kb-modal-title" class="text-lg font-bold text-slate-900">База знаний: меню и регламент</h2>' +
            '<p class="mt-0.5 text-xs text-slate-500">Эталонные данные, по которым агенты формируют вопросы и проверяют ответы кандидата</p>' +
            '</div>' +
            '<button type="button" data-action="close-kb" class="flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600" aria-label="Закрыть базу знаний">' +
            icon('x', 'h-5 w-5') +
            '</button>' +
            '</div>' +
            '<div class="border-b border-slate-200 bg-slate-50 px-6 py-3">' +
            '<div class="inline-flex items-center gap-1 rounded-lg bg-slate-200/70 p-1">' +
            '<button type="button" data-action="kb-tab" data-tab="menu" class="flex items-center gap-2 rounded-md px-3.5 py-2 text-xs font-semibold transition-colors whitespace-nowrap shrink-0 ' +
            (state.kbTab === 'menu'
              ? 'bg-white text-slate-900 shadow-sm'
              : 'text-slate-600 hover:text-slate-900') +
            '">' +
            icon('utensilsCrossed', 'h-3.5 w-3.5') +
            '<span>Меню (10 позиций)</span>' +
            '</button>' +
            '<button type="button" data-action="kb-tab" data-tab="regulation" class="flex items-center gap-2 rounded-md px-3.5 py-2 text-xs font-semibold transition-colors whitespace-nowrap shrink-0 ' +
            (state.kbTab === 'regulation'
              ? 'bg-white text-slate-900 shadow-sm'
              : 'text-slate-600 hover:text-slate-900') +
            '">' +
            icon('bookOpen', 'h-3.5 w-3.5') +
            '<span>Регламент официанта (9 пунктов)</span>' +
            '</button>' +
            '</div>' +
            '</div>' +
            '<div class="flex-1 overflow-y-auto p-6">' +
            contentHtml +
            '</div>' +
            '<div class="flex items-center justify-between border-t border-slate-200 bg-slate-50 px-6 py-3.5">' +
            '<span class="text-xs text-slate-500">Используется агентами «Экзаменатор», «Консультант» и «Сравнение ответа»</span>' +
            '<button type="button" data-action="close-kb" class="rounded-lg bg-blue-700 px-4 py-2 text-xs font-semibold text-white transition-colors hover:bg-blue-800 whitespace-nowrap shrink-0">Вернуться к стенду</button>' +
            '</div>' +
            '</div>' +
            '</div>'
          );
        }

        // =========================================================================
        // 6. Рендер и обработчики событий
        // =========================================================================

        var rootEl = document.getElementById('root');

        function render() {
          var pageHtml = '';
          if (state.view === 'landing') {
            pageHtml = renderLandingView();
          } else if (state.view === 'exam') {
            pageHtml = renderExamView();
          } else if (state.view === 'summary') {
            pageHtml = renderSummaryView();
          }

          rootEl.innerHTML = pageHtml + renderKnowledgeBaseModal();

          // Привязываем форму свободного ввода без перерисовки на каждый символ
          var freeForm = document.getElementById('free-text-form');
          var freeInput = document.getElementById('free-text-input');
          var freeSubmit = document.getElementById('free-text-submit');
          if (freeForm && freeInput && freeSubmit) {
            freeInput.addEventListener('input', function (e) {
              state.freeText = e.target.value;
              freeSubmit.disabled = !state.freeText.trim() || state.isTyping;
            });
            freeForm.addEventListener('submit', function (e) {
              e.preventDefault();
              handleFreeTextSubmit();
            });
          }
        }

        rootEl.addEventListener('click', function (e) {
          var target = e.target;
          var actionEl = target.closest('[data-action]');

          // Закрытие модального окна по клику на тёмный фон
          if (
            target &&
            target.getAttribute('data-action') === 'close-kb-backdrop'
          ) {
            state.isKnowledgeBaseOpen = false;
            render();
            return;
          }

          if (!actionEl) return;
          var action = actionEl.getAttribute('data-action');

          if (action === 'close-kb-backdrop') {
            // Игнорируем клики внутри диалога
            return;
          }

          if (action === 'start-scenario') {
            var scenarioId = actionEl.getAttribute('data-scenario-id');
            if (scenarioId) startScenario(scenarioId);
          } else if (action === 'dismiss-hint') {
            dismissHintOnce();
            render();
          } else if (action === 'open-kb') {
            dismissHintOnce();
            state.isKnowledgeBaseOpen = true;
            render();
          } else if (action === 'close-kb') {
            state.isKnowledgeBaseOpen = false;
            render();
          } else if (action === 'kb-tab') {
            var tab = actionEl.getAttribute('data-tab');
            if (tab === 'menu' || tab === 'regulation') {
              state.kbTab = tab;
              render();
            }
          } else if (action === 'go-landing') {
            clearPendingTimers();
            clearSummaryAnimations();
            state.view = 'landing';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (action === 'restart-exam') {
            resetExamStateForScenario(getActiveScenario());
            render();
          } else if (action === 'mobile-tab') {
            var mTab = actionEl.getAttribute('data-tab');
            if (mTab === 'dialog' || mTab === 'agents') {
              state.mobileTab = mTab;
              if (mTab === 'agents') state.agentsUpdatedBadge = false;
              render();
            }
          } else if (action === 'select-reply') {
            var replyId = actionEl.getAttribute('data-reply-id');
            if (replyId) handleSelectReply(replyId);
          } else if (action === 'toggle-chat-trace') {
            var msgId = actionEl.getAttribute('data-msg-id');
            var stepNum = Number(actionEl.getAttribute('data-step'));
            if (msgId) {
              state.expandedChatTraceIds[msgId] = !state.expandedChatTraceIds[msgId];
              if (!isNaN(stepNum)) state.selectedTraceStep = stepNum;
              render();
            }
          } else if (action === 'toggle-panel-trace') {
            state.isTraceExpanded = !state.isTraceExpanded;
            render();
          } else if (action === 'select-trace-step') {
            var sNum = Number(actionEl.getAttribute('data-step'));
            if (!isNaN(sNum)) {
              state.selectedTraceStep = sNum;
              render();
            }
          } else if (action === 'open-summary') {
            openSummaryScreen();
          }
        });

        window.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && state.isKnowledgeBaseOpen) {
            state.isKnowledgeBaseOpen = false;
            render();
          }
        });

        // Первый рендер
        render();
      })();
    </script>
  </body>
</html>
